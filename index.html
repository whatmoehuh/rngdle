<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="rngdle-maintenance" content="1">
<title>RNGdle Pocket</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RNGdle">
<meta name="theme-color" content="#0c0e14">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0c0e14; color: #eef0f7; font: 16px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; text-align: center; box-sizing: border-box;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  .card { max-width: 380px; display: grid; gap: 14px; justify-items: center; }
  .brand { font-weight: 800; font-size: 30px; letter-spacing: .02em; }
  .brand small { font-weight: 500; font-size: 12px; color: #959cad; letter-spacing: .06em; text-transform: uppercase; margin-left: 6px; }
  .gear { font-size: 46px; animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: #959cad; }
  .pill { font-size: 12px; color: #fcd34d; border: 1px solid #5c4d1c; border-radius: 12px; padding: 4px 10px; }
  @media (prefers-reduced-motion: reduce) { .gear { animation: none; } }
</style>
</head>
<body>
<main><div class="card">
  <div class="brand">RNGdle<small>pocket</small></div>
  <div class="gear" aria-hidden="true">⚙️</div>
  <h1>Maintenance</h1>
  <p>Big Update :O The game will be back in a few minutes — this page reloads by itself.</p>
  <p>Your rolls and scores are safe.</p>
  <span class="pill" id="status">Checking every 30 seconds</span>
</div></main>
<script>
// When the real game is back (no maintenance marker), load it.
async function check() {
  try {
    const r = await fetch("./?check=" + Date.now(), { cache: "no-store" });
    const t = await r.text();
    if (r.ok && !t.includes('name="rngdle-maintenance"')) location.replace("./?v=" + Date.now() + location.hash);
  } catch {}
}
setInterval(check, 30000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
</script>
</body>
</html>
